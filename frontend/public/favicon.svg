<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07132e"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0" y1="100" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  
  <!-- Subtle floor glow -->
  <ellipse cx="50" cy="86" rx="42" ry="5" fill="#00b4ff" opacity="0.35"/>

  <!-- Ascending Bar chart -->
  <rect x="14" y="74" width="7" height="12" rx="2" fill="url(#barGlow)"/>
  <rect x="25" y="68" width="7" height="18" rx="2" fill="url(#barGlow)"/>
  <rect x="36" y="60" width="7" height="26" rx="2" fill="url(#barGlow)"/>
  <rect x="47" y="50" width="7" height="36" rx="2" fill="url(#barGlow)"/>
  <rect x="58" y="38" width="7" height="48" rx="2" fill="url(#barGlow)"/>
  <rect x="69" y="26" width="7" height="60" rx="2" fill="url(#barGlow)"/>
  <rect x="80" y="30" width="7" height="56" rx="2" fill="url(#barGlow)"/>

  <!-- Upward swooping exponential arrow curve -->
  <path d="M 12 78 Q 50 72 74 24" fill="none" stroke="#00ffff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow Head -->
  <polygon points="75,16 65,28 79,26" fill="#00ffff" filter="url(#glow)"/>
</svg>
