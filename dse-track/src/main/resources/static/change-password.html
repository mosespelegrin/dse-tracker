<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password — DSE Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f5; --surface: #ffffff; --border: #e2e5ea;
      --text-1: #0f1117; --text-2: #5a6072; --text-3: #9aa0b0;
      --accent: #1a56db; --red: #dc2626; --red-bg: #fef2f2;
      --amber: #b45309; --amber-bg: #fffbeb; --amber-border: #fde68a;
      --radius-md: 12px; --font: 'DM Sans', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0d0f14; --surface: #161920; --border: #272b36;
      --text-1: #eef0f5; --text-2: #8892a4; --text-3: #4e5668;
      --accent: #4b8eff; --red: #f87171; --red-bg: #1f0a0a;
      --amber: #fbbf24; --amber-bg: #1f1500; --amber-border: #4a3a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: var(--font); background: var(--bg); color: var(--text-1); padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 28px; box-shadow: 0 4px 12px rgba(15,17,23,0.08);
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p.sub { color: var(--text-2); font-size: 13px; margin: 0 0 18px; }
    .notice {
      background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber);
      font-size: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 18px;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text-1); font-family: var(--font); font-size: 13px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 10px; border: none; border-radius: 8px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .err { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }
    .logout { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-3); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Change your password</h1>
    <p class="sub">Set a new password for your account.</p>
    <div class="notice" id="forcedNotice" style="display:none">
      This account was created with a temporary password and can't be used
      elsewhere until you set a new one.
    </div>

    <form id="changeForm">
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" required autocomplete="current-password">

      <label for="next">New password</label>
      <input id="next" name="next" type="password" required minlength="6" autocomplete="new-password">

      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password">

      <button type="submit" id="submitBtn">Change password</button>
      <div class="err" id="errMsg"></div>
    </form>

    <a class="logout" id="logoutLink" href="#">Log out instead</a>
  </div>

  <script>
    const API = 'http://localhost:8081';
    const token = localStorage.getItem('dse_token');
    const user  = JSON.parse(localStorage.getItem('dse_user') || '{}');

    if (!token) { window.location.href = 'index.html'; }

    document.getElementById('forcedNotice').style.display = user.mustChangePassword ? '' : 'none';

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('dse_token');
      localStorage.removeItem('dse_user');
      window.location.href = 'index.html';
    });

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errMsg');
      errEl.style.display = 'none';

      const currentPassword = document.getElementById('current').value;
      const newPassword     = document.getElementById('next').value;
      const confirm          = document.getElementById('confirm').value;

      if (newPassword !== confirm) {
        errEl.textContent = 'New passwords do not match';
        errEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Changing…';

      try {
        const res = await fetch(`${API}/auth/change-password`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('dse_token', data.token);
          localStorage.setItem('dse_user', JSON.stringify({
            name: data.name, email: data.email, role: data.role, mustChangePassword: data.mustChangePassword
          }));
          window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Could not change password';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Could not connect to server';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Change password';
      }
    });
  </script>
</body>
</html>
