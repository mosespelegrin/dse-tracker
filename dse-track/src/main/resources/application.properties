spring.application.name=dse-track

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dse_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Connection pool — bounded so the app can't open unbounded DB connections
# under load. 10 is plenty for a small app; raise only if you actually need to.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=dse-track-pool

# Schema is now owned by Flyway (see db/migration/) — Hibernate only
# validates that entities match what Flyway created, it never mutates the
# schema itself. "update"/"create" have no place once Flyway is in charge.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# baseline-on-migrate lets Flyway adopt an EXISTING database (e.g. one built by
# the old ddl-auto=update) without trying to re-run V1 against it — only a
# brand-new empty database actually executes V1 from scratch.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Shows the SQL queries JPA runs — useful while learning, turn off in production (noisy + slightly slower)
spring.jpa.show-sql=${SHOW_SQL:true}

# Your app runs on http://localhost:8081
server.port=8081

# Tomcat thread pool — bounded so a traffic spike can't spawn unbounded
# threads (each carries its own stack memory). 50 is generous for a small app.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:5}
server.tomcat.accept-count=50

# Health/readiness endpoint for container orchestration (Docker healthcheck, etc.)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Email is optional/best-effort by design (EmailService already swallows send
# failures) — don't let an unconfigured/unreachable mailbox report the whole
# app as DOWN just because MAIL_USERNAME/PASSWORD aren't set.
management.health.mail.enabled=false

# JWT secret key - Must be at least 32 characters long.
# Set the JWT_SECRET env var to a real random value in any shared/prod environment —
# the fallback below is a dev-only placeholder and must never be relied on outside localhost.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_placeholder_not_for_prod_32bytes}

# 24 hours in milliseconds
app.jwt.expiration=86400000

# Refresh token lifetime — 30 days in milliseconds
app.jwt.refresh-expiration=2592000000

# If true, login is blocked until the user clicks the email verification link.
# Off by default so existing/test accounts created before this feature aren't locked out —
# flip via REQUIRE_EMAIL_VERIFICATION=true once you're ready to enforce it.
app.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

# Google Sign-In — the OAuth 2.0 Client ID from Google Cloud Console
# (console.cloud.google.com/apis/credentials, "OAuth client ID" > "Web application").
# Add your dev/prod origins under "Authorized JavaScript origins" there.
# This is a public identifier, safe to expose in frontend code — no client secret needed
# for the ID-token verification flow used here.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Base URL the frontend is served from — used to build links in verification/reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:8081}

# Comma-separated list of origins allowed to call this API. Set
# CORS_ALLOWED_ORIGINS to your real frontend domain(s) in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:4200}

# Email (SMTP) — used to notify users when a price alert triggers.
# Set MAIL_USERNAME / MAIL_PASSWORD as environment variables — never commit real
# credentials here. For Gmail, MAIL_PASSWORD must be a 16-char App Password
# (myaccount.google.com/apppasswords), not your normal account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Order-export CSV upload size limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB