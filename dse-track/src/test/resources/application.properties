spring.application.name=dse-track-test

# In-memory DB — tests never touch the real MySQL database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests build their own schema from the @Entity classes — Flyway's migrations
# are validated separately (against real MySQL), not exercised here
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test_only_jwt_secret_key_at_least_32_bytes_long_for_unit_tests
app.jwt.expiration=3600000
app.jwt.refresh-expiration=3600000
app.security.require-email-verification=false
app.frontend-url=http://localhost:4200
app.google.client-id=

# No real SMTP in tests — EmailService swallows send failures, so this just
# needs to be present, not actually reachable
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test
